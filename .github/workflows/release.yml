# Builds the Windows and Linux installers and publishes them as a GitHub Release.
# Runs when the `release` branch is updated, when a version tag (v0.2.0, ...) is pushed,
# or by hand from the Actions tab. The version comes from src-tauri/tauri.conf.json.
# The installed app checks the latest release's latest.json to update itself.
name: Release

on:
  push:
    branches: [release]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - id: release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { version } = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            const tag = `v${version}`;
            const { owner, repo } = context.repo;
            const lines = fs.readFileSync('CHANGELOG.md', 'utf8').split(/\r?\n/);
            const start = lines.findIndex((line) => line.startsWith(`## [${version}]`));
            if (start < 0) throw new Error(`Missing changelog entry for ${version}`);
            let end = start + 1;
            while (end < lines.length && !lines[end].startsWith('## ')) end++;
            const notes = lines.slice(start + 1, end).join('\n').trim();
            const body = [
              notes, '', '### Downloads',
              '- Windows: download the `Doodle_..._x64-setup.exe` installer from the assets below.',
              '- Linux: the existing build also provides AppImage and Debian packages.',
              '- Existing installations can check for this version from Settings → Check for updates.',
            ].join('\n');
            try {
              const { data } = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              await github.rest.repos.updateRelease({ owner, repo, release_id: data.id, body });
              core.info(`Release ${tag} already exists; refreshed its English notes.`);
              return data.id;
            } catch (e) {
              if (e.status !== 404) throw e;
              const { data } = await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, target_commitish: context.sha,
                name: `Doodle ${tag}`, body, draft: false, prerelease: false,
              });
              return data.id;
            }

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            bundles: nsis
          - platform: ubuntu-22.04
            bundles: appimage,deb
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build libraries
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: Stamp stable build identity
        run: |
          node -e "const fs=require('fs'); fs.writeFileSync('src/build-info.js', 'window.__DOODLE_BUILD__ = '+JSON.stringify({channel:'stable',revision:process.env.GITHUB_SHA})+';');"

      - name: Build and upload to the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # assina as atualizações; a chave fica só nos segredos do repositório
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tauriScript: tauri
          args: --bundles ${{ matrix.bundles }}
          releaseId: ${{ needs.create-release.outputs.release_id }}
